<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - ISL Kids</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a00ff, #b84dff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .login-box h2 {
      margin: 0 0 10px;
      color: #5a00d6;
      font-size: 26px;
    }

    .login-box p.sub {
      margin: 0 0 25px;
      color: #666;
      font-size: 14px;
    }

    .error-msg {
      background: #ffe5e5;
      color: #c20000;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #8a2be2;
      box-shadow: 0px 0px 6px rgba(138, 43, 226, 0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #7b2cff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #5f00d6;
      transform: scale(1.02);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      color: #888;
    }

    .emoji {
      font-size: 40px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="emoji">💜</div>
    <h2>Admin Login 🔐</h2>
    <p class="sub">Only teachers can access this page</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="password" name="password" placeholder="Enter Admin Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="footer-note">
      ISL Kids Community 🌈
    </div>
  </div>

</body>
</html>
