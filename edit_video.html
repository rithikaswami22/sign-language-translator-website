<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Video - ISL Kids</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a00ff, #b84dff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.25);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #5a00d6;
      font-size: 26px;
    }

    .sub {
      text-align: center;
      color: #666;
      margin-top: -8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      font-weight: bold;
      color: #444;
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #8a2be2;
      box-shadow: 0px 0px 6px rgba(138, 43, 226, 0.4);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #7b2cff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 18px;
    }

    .btn:hover {
      background: #5f00d6;
      transform: scale(1.02);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      text-decoration: none;
      color: #5a00d6;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Edit Video ✏️</h2>
    <p class="sub">Update learning video details for kids</p>

    <form method="POST">
      <label>Video Title</label>
      <input type="text" name="title" value="{{ video.title }}" required>

      <label>YouTube Embed Link</label>
      <input type="text" name="youtube" value="{{ video.youtube }}" required>

      <button class="btn" type="submit">Update Video</button>
    </form>

    <a class="back" href="/admin/panel">⬅ Back to Admin Panel</a>
  </div>

</body>
</html>
